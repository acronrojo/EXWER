<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alea · Decisor Aleatorio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,800;1,900&family=Caveat:wght@700&family=Playfair+Display:ital@0;1&family=Courier+Prime:wght@400;700&family=Gloria+Hallelujah&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F9F8F6; --surface: #FFFFFF; --primary: #f59e0b;
    --text: #1A2F2B; --text-muted: #5C6E6A; --border: #E2E1DD;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; user-select: none; -webkit-user-select: none; }
  textarea, input { user-select: text; -webkit-user-select: text; }
  
  body {
    background-color: #FDFBF7; color: var(--text); min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background-image: 
      radial-gradient(at 40% 20%, hsla(28,100%,74%,0.15) 0px, transparent 50%),
      radial-gradient(at 80% 0%, hsla(189,100%,56%,0.1) 0px, transparent 50%),
      radial-gradient(at 0% 50%, hsla(355,100%,93%,0.2) 0px, transparent 50%),
      radial-gradient(at 80% 50%, hsla(340,100%,76%,0.1) 0px, transparent 50%),
      radial-gradient(at 0% 100%, hsla(22,100%,77%,0.15) 0px, transparent 50%),
      radial-gradient(at 80% 100%, hsla(242,100%,70%,0.1) 0px, transparent 50%),
      radial-gradient(at 0% 0%, hsla(343,100%,76%,0.1) 0px, transparent 50%);
    background-attachment: fixed;
  }

  .menu-container { text-align: center; padding: 20px; animation: fadeIn 0.4s ease; }
  .menu-container h1 { 
    font-size: 48px; margin-bottom: 8px; font-weight: 900;
    background: linear-gradient(to right, #f59e0b, #ef4444, #8b5cf6);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 5px rgba(239,68,68,0.2));
  }
  .menu-container p { color: var(--text-muted); font-size: 16px; margin-bottom: 40px; }
  
  .options { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; max-width: 900px; align-items: center; }
  
  .card-opt {
    background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 20px;
    width: 170px; height: 190px; cursor: pointer; transition: 0.3s;
    box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.05);
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 15px;
  }
  .icon-box { width: 75px; height: 75px; font-size: 40px; margin-bottom: 15px; }
  .card-opt h2 { font-size: 15px; }
  .card-opt:hover { transform: translateY(-8px); box-shadow: 0 15px 35px rgba(31, 38, 135, 0.1); border-color: rgba(255, 255, 255, 0.8); background: rgba(255, 255, 255, 0.9); }
  
  .icon-box { width: 60px; height: 60px; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .icon-coin { background: linear-gradient(135deg, #fcd34d, #f59e0b); border-radius: 50%; border: 3px solid #b45309; font-size: 30px; box-shadow: 0 8px 15px rgba(245, 158, 11, 0.4); }
  .icon-dice { background: #fff; border-radius: 14px; border: 3px solid var(--text); font-size: 40px; box-shadow: 0 4px 8px rgba(239, 68, 68, 0.2); color: var(--text); }
  .icon-roll { background: linear-gradient(135deg, #10b981, #059669); border-radius: 14px; border: 3px solid #047857; font-size: 30px; box-shadow: 0 8px 15px rgba(16, 185, 129, 0.4); color: white; }
  .icon-triple { background: linear-gradient(135deg, #ef4444, #b91c1c); border-radius: 14px; border: 3px solid #7f1d1d; font-size: 30px; box-shadow: 0 8px 15px rgba(239, 68, 68, 0.4); color: white; }
  .icon-rps { background: linear-gradient(135deg, #3b82f6, #2563eb); border-radius: 14px; border: 3px solid #1e40af; box-shadow: 0 8px 15px rgba(59, 130, 246, 0.4); font-size: 16px; gap: 1px; color: white; }
  .icon-wheel { background: linear-gradient(135deg, #ec4899, #8b5cf6); border-radius: 14px; border: 3px solid #4c1d95; font-size: 30px; box-shadow: 0 8px 15px rgba(139, 92, 246, 0.4); color: white; }
  .icon-writer { background: linear-gradient(135deg, #64748b, #334155); border-radius: 14px; border: 3px solid #0f172a; font-size: 30px; box-shadow: 0 8px 15px rgba(51, 65, 85, 0.4); color: white; }
  .card-opt h2 { font-size: 13px; color: var(--text); margin: 0; line-height: 1.25; text-align: center; font-weight: 800; }

  #overlay {
    position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(8px);
    display: none; align-items: center; justify-content: center; z-index: 1000;
  }
  #overlay.active { display: flex; }
  
  .game-window {
    background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    width: 95%; max-width: 800px; min-height: 550px; border-radius: 32px;
    padding: 40px; text-align: center; position: relative;
    box-shadow: 0 30px 60px -12px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.8); 
    border: 1px solid rgba(255, 255, 255, 0.6);
    display: flex; flex-direction: column; justify-content: space-between;
    animation: popIn 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  
  #close-btn { position: absolute; top: 24px; right: 28px; background: transparent; border: none; font-size: 32px; font-weight: bold; color: var(--text-muted); cursor: pointer; transition: 0.2s; line-height: 1; }
  #close-btn:hover { color: #ef4444; transform: scale(1.2); }

  #game-title { font-size: 32px; color: var(--text); font-weight: 800; margin-bottom: 20px; }

  .display-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 20px; perspective: 1000px; position: relative; width: 100%; }

  .coin { width: 200px; height: 200px; border-radius: 50%; background: linear-gradient(135deg, #fcd34d, #f59e0b); border: 8px solid #b45309; display: flex; align-items: center; justify-content: center; font-size: 90px; line-height: 1; box-shadow: 0 15px 35px rgba(245, 158, 11, 0.4), inset 0 -5px 15px rgba(0,0,0,0.1); }
  .dice { width: 200px; height: 200px; background: #fff; border-radius: 32px; border: 8px solid var(--text); display: flex; align-items: center; justify-content: center; font-size: 260px; line-height: 0; color: var(--text); box-shadow: 0 15px 35px rgba(239, 68, 68, 0.6), inset 0 -8px 20px rgba(0,0,0,0.05); overflow: hidden; }

  .roll-container { width: 100%; height: 180px; background: #f1f5f9; border-radius: 20px; border: 4px solid var(--text); position: relative; overflow: hidden; display: flex; align-items: center; }
  .roll-pointer { position: absolute; top: -4px; bottom: -4px; left: 50%; transform: translateX(-50%); width: 6px; background: #ef4444; z-index: 10; border-radius: 3px; box-shadow: 0 0 10px rgba(239, 68, 68, 0.5); }
  .roll-pointer::after { content: '▼'; position: absolute; top: -25px; left: 50%; transform: translateX(-50%); color: #ef4444; font-size: 24px; }
  .roll-track { display: flex; gap: 12px; padding: 0 12px; position: absolute; left: 0; top: 50%; transform: translateY(-50%); transition: transform 4s cubic-bezier(0.1, 0.8, 0.2, 1); will-change: transform; }
  .roll-item { width: 110px; height: 110px; flex-shrink: 0; background: #fff; border: 4px solid #cbd5e1; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 55px; line-height: 1; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

  .slot-wrapper { position: relative; width: 100%; max-width: 400px; margin: 0 auto; }
  .slot-reels { display: flex; justify-content: center; gap: 12px; height: 294px; overflow: hidden; background: #f1f5f9; border-radius: 20px; border: 4px solid var(--text); padding: 0 12px; }
  .reel { width: 90px; height: 100%; overflow: hidden; position: relative; }
  .reel-track { display: flex; flex-direction: column; gap: 12px; position: absolute; top: 0; transition: transform 4s cubic-bezier(0.1, 0.8, 0.2, 1); will-change: transform; }
  .reel-item { width: 90px; height: 90px; flex-shrink: 0; background: #fff; border: 4px solid #cbd5e1; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 50px; line-height: 1; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
  .slot-pointer { position: absolute; top: 50%; left: -8px; right: -8px; height: 6px; background: #ef4444; transform: translateY(-50%); z-index: 10; border-radius: 3px; box-shadow: 0 0 10px rgba(239, 68, 68, 0.5); }
  .slot-pointer::before, .slot-pointer::after { content: '▶'; position: absolute; top: 50%; transform: translateY(-50%); color: #ef4444; font-size: 24px; }
  .slot-pointer::before { left: -26px; }
  .slot-pointer::after { right: -26px; content: '◀'; }

  .winner { border-color: #10b981 !important; background: #ecfdf5 !important; transform: scale(1.05); box-shadow: 0 0 20px rgba(16, 185, 129, 0.4) !important; transition: all 0.3s ease; }
  .seven-casino { font-family: 'Inter', sans-serif; font-weight: 900; font-style: italic; color: #ef4444; font-size: 75px; letter-spacing: -2px; -webkit-text-stroke: 3px white; paint-order: stroke fill; text-shadow: 0 5px 0 #991b1b, 0 7px 12px rgba(0,0,0,0.3); transform: skewX(-10deg); display: inline-block; line-height: 1; }
  #legend-container { display: none; justify-content: center; align-items: center; flex-wrap: wrap; gap: 6px; padding: 10px; background: #f8fafc; border-radius: 16px; border: 1px dashed #cbd5e1; margin-bottom: 20px; }
  #legend-container.active { display: flex; }
  #legend-container span { font-size: 20px; line-height: 1; }
  #legend-container .seven-legend { font-family: 'Inter', sans-serif; font-weight: 900; font-style: italic; color: #ef4444; font-size: 24px; -webkit-text-stroke: 2px white; paint-order: stroke fill; text-shadow: 0 2px 0 #991b1b; transform: skewX(-10deg); }

  .rps-wrapper { display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
  .rps-machine-box { width: 160px; height: 160px; background: #f1f5f9; border: 4px solid var(--text); border-radius: 24px; display: flex; align-items: center; justify-content: center; font-size: 90px; line-height: 1; box-shadow: 0 10px 25px rgba(0,0,0,0.1); font-family: 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif; }
  .rps-result { font-size: 28px; font-weight: 800; margin-top: 10px; min-height: 40px; }
  .rps-controls { display: flex; gap: 16px; justify-content: center; width: 100%; }
  .rps-btn { background: #fff; border: 3px solid #cbd5e1; border-radius: 20px; width: 110px; padding: 15px 10px; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); min-height: 130px; }
  .rps-btn:hover { border-color: var(--primary); transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
  .rps-btn:active { transform: translateY(0); }
  .rps-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
  .rps-emoji { font-size: 48px; line-height: 1; display: inline-flex; align-items: center; justify-content: center; font-family: 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif; }
  .rps-txt { font-weight: 700; color: var(--text); font-size: 14px; }

  .custom-toolbar { display: flex; justify-content: center; gap: 10px; margin-top: -10px; margin-bottom: 20px; }
  .btn-custom, .btn-reset { background: #f8fafc; border: 2px solid #cbd5e1; color: #475569; padding: 8px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 6px; font-family: inherit; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
  .btn-custom:hover { background: #e0e7ff; border-color: #818cf8; color: #3730a3; }
  .btn-reset:hover { background: #fee2e2; border-color: #f87171; color: #991b1b; }
  .btn-custom:active, .btn-reset:active { transform: scale(0.95); }

  .custom-form { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 500px; margin: 0 auto; text-align: left; }
  .custom-form textarea { width: 100%; height: 100px; padding: 12px; border: 2px solid var(--border); border-radius: 12px; font-family: inherit; font-size: 14px; resize: none; outline: none; transition: 0.2s; }
  .custom-form textarea:focus { border-color: var(--primary); }
  .btn-custom-run { background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; border: none; padding: 15px; border-radius: 12px; font-size: 16px; font-weight: 800; cursor: pointer; transition: 0.2s; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 4px 10px rgba(245, 158, 11, 0.3); }
  .btn-custom-run:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(245, 158, 11, 0.4); }

  .roulette-layout { display: flex; flex-direction: row; align-items: center; justify-content: space-between; gap: 30px; width: 100%; max-width: 650px; margin: 0 auto; }
  .roulette-controls { flex: 1; display: flex; flex-direction: column; gap: 15px; }
  .roulette-controls textarea { width: 100%; height: 180px; padding: 15px; border: 2px solid var(--border); border-radius: 12px; font-family: inherit; font-size: 16px; resize: none; outline: none; transition: 0.2s; }
  .roulette-controls textarea:focus { border-color: var(--primary); }
  @media (max-width: 650px) { .roulette-layout { flex-direction: column; } .roulette-controls { width: 100%; } }
  .wheel-container { position: relative; width: 280px; height: 280px; flex-shrink: 0; }
  #wheel-canvas { width: 100%; height: 100%; border-radius: 50%; box-shadow: 0 10px 25px rgba(0,0,0,0.2); transition: transform 4s cubic-bezier(0.17, 0.67, 0.1, 1); }
  .wheel-pointer { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); font-size: 40px; color: #ef4444; z-index: 10; text-shadow: 0 2px 5px rgba(0,0,0,0.3); line-height: 1; }
  .wheel-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 50px; height: 50px; background: #fff; border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 5; border: 4px solid #cbd5e1; }

  .writer-display { font-size: 42px; font-weight: 900; color: var(--text); padding: 20px; min-height: 120px; display: flex; align-items: center; justify-content: center; text-align: center; word-break: break-word; background: #f8fafc; border-radius: 16px; border: 4px dashed #cbd5e1; width: 100%; max-width: 500px; margin-bottom: 20px; transition: 0.2s; }
  .writer-display.active { border-color: #10b981; background: #ecfdf5; color: #047857; }

  .note-paper {
    word-break: break-word;
    background: #fef08a;
    background-image: linear-gradient(90deg, transparent 40px, #fca5a5 40px, #fca5a5 42px, transparent 42px), linear-gradient(#e5e7eb 1px, transparent 1px);
    background-size: 100% 100%, 100% 2em;
    line-height: 2em;
    color: #1f2937;
    font-family: 'Comic Sans MS', 'Caveat', cursive, sans-serif;
    padding: 20px 30px 20px 60px;
    border-radius: 8px;
    border: 4px solid #facc15;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    min-height: 250px;
    height: auto;
    width: 100%;
    max-width: 600px;
    margin-bottom: 20px;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; text-align: center;
    overflow-wrap: break-word;
    transform: rotate(-1deg);
    transition: all 0.3s ease;
  }

  .btn-action { width: 100%; max-width: 300px; margin: 0 auto; padding: 20px; border-radius: 20px; border: none; background: linear-gradient(135deg, #1A2F2B, #2c4a45); color: white; font-size: 20px; font-weight: 800; cursor: pointer; transition: 0.2s; box-shadow: 0 6px 0 #0f172a, 0 10px 20px rgba(0,0,0,0.2); text-transform: uppercase; letter-spacing: 2px; }
  .btn-action:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 0 #0f172a, 0 15px 25px rgba(0,0,0,0.2); }
  .btn-action:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 #0f172a, 0 5px 10px rgba(0,0,0,0.2); }
  .btn-action:disabled { background: #94a3b8; cursor: not-allowed; transform: none; box-shadow: none; }

  .sticker-coin { width: 120px; height: 120px; border-radius: 50%; background: linear-gradient(135deg, #fcd34d, #f59e0b); border: 6px solid #b45309; animation: spinCoinFast 0.3s linear infinite; }
  @keyframes spinCoinFast { 0% { transform: rotateY(0deg); } 100% { transform: rotateY(180deg); } }
  .sticker-dice { width: 120px; height: 120px; background: #fff; border-radius: 20px; border: 6px solid var(--text); animation: rollDiceFast 0.3s linear infinite; }
  @keyframes rollDiceFast { 0% { transform: rotate(0deg) scale(0.9); } 50% { transform: rotate(180deg) scale(1.1); } 100% { transform: rotate(360deg) scale(0.9); } }
  .pop { animation: popResult 0.3s cubic-bezier(0.2, 1.5, 0.4, 1); }
  @keyframes popResult { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>

  <div class="menu-container">
    <h1>🎲 Alea</h1>
    <p>Deja que el azar decida por ti</p>
    
    <div class="options">
      <div class="card-opt" onclick="abrirJuego('coin')">
        <div class="icon-box icon-coin">👑</div><h2>Cara o Cruz</h2>
      </div>
      <div class="card-opt" onclick="abrirJuego('dice')">
        <div class="icon-box icon-dice">⚄</div><h2>Dado</h2>
      </div>
      <div class="card-opt" onclick="abrirJuego('roll')">
        <div class="icon-box icon-roll">🎰</div><h2>Roll</h2>
      </div>
      <div class="card-opt" onclick="abrirJuego('triple')">
        <div class="icon-box icon-triple">🎰</div><h2>Triple Roll</h2>
      </div>
      <div class="card-opt" onclick="abrirJuego('rps')">
        <div class="icon-box icon-rps">✊✋✌️</div><h2>Piedra, Papel o Tijera</h2>
      </div>
      <div class="card-opt" onclick="abrirJuego('roulette')">
        <div class="icon-box icon-wheel">🎡</div><h2>Ruleta</h2>
      </div>
      <div class="card-opt" onclick="abrirJuego('writer')">
        <div class="icon-box icon-writer">🎯</div><h2>Elector Rápido</h2>
      </div>
      
      <div class="card-opt" onclick="abrirJuego('writer_note')">
        <div class="icon-box" style="background: linear-gradient(135deg, #fef08a, #eab308); border-radius: 14px; border: 3px solid #a16207; font-size: 30px; box-shadow: 0 8px 15px rgba(234, 179, 8, 0.4); color: white; display: flex; align-items: center; justify-content: center;">📝</div>
        <h2>Escritor</h2>
      </div>
      
    </div>
  </div>

  <canvas id="confetti-canvas" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999;"></canvas>
<div id="overlay">
    <div class="game-window">
      <button id="close-btn" onclick="cerrarJuego()">×</button>
      <h2 id="game-title">Moneda</h2>
      
      <div class="custom-toolbar">
        <button class="btn-reset" onclick="abrirJuego(modoActual)">🔄 Reset</button>
      </div>

      <div class="display-area" id="display-area"></div>
      <div id="legend-container"></div>
      <button class="btn-action" id="btn-lanzar" onclick="lanzar()">¡Lanzar!</button>
    </div>
  </div>

<script>
  let modoActual = 'coin';
  let animando = false;
  let timeoutId = null;
  let intervalId = null;

  let audioCtx;
  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  
  function playSound(type) {
    initAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    
    if(type === 'tick') {
      osc.type = 'sine'; osc.frequency.setValueAtTime(900, now); // Sonido más suave
      gain.gain.setValueAtTime(0.04, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
      osc.start(now); osc.stop(now + 0.05);
    } else if(type === 'win') {
      osc.type = 'triangle'; osc.frequency.setValueAtTime(523.25, now);
      osc.frequency.setValueAtTime(659.25, now + 0.1);
      osc.frequency.setValueAtTime(783.99, now + 0.2);
      gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.6);
      osc.start(now); osc.stop(now + 0.6);
    } else if(type === 'lose') {
      osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, now);
      osc.frequency.linearRampToValueAtTime(100, now + 0.3);
      gain.gain.setValueAtTime(0.05, now); gain.gain.linearRampToValueAtTime(0, now + 0.3);
      osc.start(now); osc.stop(now + 0.3);
    } else if(type === 'type') {
      osc.type = 'square'; osc.frequency.setValueAtTime(800, now);
      gain.gain.setValueAtTime(0.03, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
      osc.start(now); osc.stop(now + 0.03);
    }
  }

  function lanzarConfeti() {
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    let particles = [];
    for(let i=0; i<150; i++) {
      particles.push({
        x: Math.random() * canvas.width, y: Math.random() * canvas.height - canvas.height,
        w: Math.random() * 10 + 5, h: Math.random() * 10 + 5,
        c: ['#f59e0b', '#10b981', '#ef4444', '#3b82f6', '#8b5cf6'][Math.floor(Math.random()*5)],
        vx: Math.random() * 4 - 2, vy: Math.random() * 5 + 2,
        rot: Math.random() * 360, rotSpeed: Math.random() * 10 - 5
      });
    }
    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      let active = false;
      particles.forEach(p => {
        if(p.y < canvas.height) active = true;
        p.x += p.vx; p.y += p.vy; p.rot += p.rotSpeed;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot * Math.PI / 180);
        ctx.fillStyle = p.c; ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h); ctx.restore();
      });
      if(active) requestAnimationFrame(animate);
    }
    animate();
  }

  const overlay = document.getElementById('overlay');
  const title = document.getElementById('game-title');
  const display = document.getElementById('display-area');
  const btnLanzar = document.getElementById('btn-lanzar');
  const legendContainer = document.getElementById('legend-container');

  const emojisData = [
    { emoji: '💎', weight: 3 }, { emoji: '🍎', weight: 12 }, { emoji: '🍋', weight: 15 },
    { emoji: '🔔', weight: 10 }, { emoji: '🍒', weight: 20 }, { emoji: '7', weight: 2 },
    { emoji: '⭐', weight: 8 }, { emoji: '🍀', weight: 5 }, { emoji: '🎁', weight: 15 }, { emoji: '🍇', weight: 10 }
  ];

  const RPS_EMOJI = { piedra: '✊', papel: '✋', tijera: '✌️' };
  const rpsOptions = ['piedra', 'papel', 'tijera'];

  function getWeightedRandom() {
    const totalWeight = emojisData.reduce((sum, item) => sum + item.weight, 0);
    let random = Math.random() * totalWeight;
    for (let i = 0; i < emojisData.length; i++) {
      if (random < emojisData[i].weight) return emojisData[i].emoji;
      random -= emojisData[i].weight;
    }
    return emojisData[0].emoji;
  }

  function abrirJuego(modo) {
    modoActual = modo;
    overlay.classList.add('active');
    
    if (document.querySelector('.custom-toolbar')) document.querySelector('.custom-toolbar').style.display = 'flex';
    
    clearTimeout(timeoutId);
    clearInterval(intervalId);
    animando = false; 

    btnLanzar.style.display = 'block';
    btnLanzar.disabled = false;
    btnLanzar.textContent = '¡Lanzar!';
    legendContainer.classList.remove('active');
    legendContainer.innerHTML = '';
    
    if(modo === 'coin') {
      title.textContent = 'Lanzar Moneda';
      display.innerHTML = '<div class="coin pop">👑</div>';
    } 
    else if(modo === 'dice') {
      title.textContent = 'Lanzar Dado';
      display.innerHTML = '<div class="dice pop">⚅</div>';
    } 
    else if(modo === 'roll') {
      title.textContent = 'Sorteo Roll';
      mostrarLeyenda();
      display.innerHTML = `<div class="roll-container" id="roll-container"><div class="roll-pointer"></div><div class="roll-track" id="roll-track"></div></div>`;
      generarRollHorizontal(getWeightedRandom());
    } 
    else if(modo === 'triple') {
      title.textContent = 'Triple Roll';
      mostrarLeyenda();
      display.innerHTML = `<div class="slot-wrapper"><div class="slot-pointer"></div><div class="slot-reels"><div class="reel"><div class="reel-track" id="track-0"></div></div><div class="reel"><div class="reel-track" id="track-1"></div></div><div class="reel"><div class="reel-track" id="track-2"></div></div></div></div>`;
      generarRollVertical([getWeightedRandom(), getWeightedRandom(), getWeightedRandom()]);
    }
    else if(modo === 'roulette') {
      title.textContent = 'Ruleta de la Suerte';
      btnLanzar.style.display = 'none';
      display.innerHTML = `
        <div class="roulette-layout">
          <div class="roulette-controls">
            <textarea id="roulette-options" placeholder="Escribe opciones separadas por coma...">Paco, Maria, Pedro, Ana, Luis</textarea>
            <button class="btn-custom-run" onclick="girarRuleta()">¡Girar Ruleta!</button>
            <div id="roulette-result" style="font-size: 24px; font-weight: 900; color: #10b981; min-height: 40px; margin-top: 10px; text-align: center; text-transform: uppercase;"></div>
          </div>
          <div class="wheel-container">
            <div class="wheel-pointer">▼</div>
            <canvas id="wheel-canvas" width="280" height="280"></canvas>
            <div class="wheel-center"></div>
          </div>
        </div>
      `;
      dibujarRuleta();
    }
    else if(modo === 'writer') {
      title.textContent = 'Elector Rápido';
      btnLanzar.style.display = 'none';
      display.innerHTML = `
        <div class="custom-form">
          <textarea id="writer-options" placeholder="Escribe opciones separadas por coma...">paco, maria, pedro</textarea>
          <div class="writer-display" id="writer-display">...</div>
          <button class="btn-custom-run" onclick="ejecutarEscritor()">¡Elegir Nombre!</button>
        </div>
      `;
    }
    else if(modo === 'writer_note') {
      title.textContent = 'Escritor';
      btnLanzar.style.display = 'none';
      display.innerHTML = `
        <div class="custom-form">
          <textarea id="note-options" placeholder="Escribe opciones separadas por coma...">paco, maria, pedro</textarea>
          <div id="note-display" class="note-paper"></div>
          <button class="btn-custom-run" onclick="ejecutarEscritorNota()">¡Escribir Ganador!</button>
        </div>
      `;
    }
    else if(modo === 'rps') {
      title.textContent = 'Piedra, Papel o Tijera';
      btnLanzar.style.display = 'none'; 
      display.innerHTML = `
        <div class="rps-wrapper">
          <div class="rps-machine-box" id="rps-machine">${RPS_EMOJI.piedra}</div>
          <div class="rps-result" id="rps-result">Elige una opción</div>
          <div class="rps-controls" id="rps-controls">
            <button class="rps-btn" onclick="jugarRPS('piedra')"><span class="rps-emoji">${RPS_EMOJI.piedra}</span><span class="rps-txt">Piedra</span></button>
            <button class="rps-btn" onclick="jugarRPS('papel')"><span class="rps-emoji">${RPS_EMOJI.papel}</span><span class="rps-txt">Papel</span></button>
            <button class="rps-btn" onclick="jugarRPS('tijera')"><span class="rps-emoji">${RPS_EMOJI.tijera}</span><span class="rps-txt">Tijera</span></button>
          </div>
        </div>
      `;
    }
  }

  function cerrarJuego() {
    overlay.classList.remove('active');
    clearTimeout(timeoutId);
    clearInterval(intervalId);
    animando = false;
  }

  function mostrarLeyenda() {
    legendContainer.innerHTML = emojisData.map(item => {
      if(item.emoji === '7') return `<span class="seven-legend">7</span>`;
      return `<span>${item.emoji}</span>`;
    }).join('');
    legendContainer.classList.add('active');
  }

  function generarRollHorizontal(ganador) {
    const track = document.getElementById('roll-track');
    if(!track) return;
    track.style.transition = 'none';
    track.style.transform = 'translateY(-50%) translateX(0)';
    track.innerHTML = '';
    for(let i = 0; i < 30; i++) {
      let emoji = (i === 25) ? ganador : getWeightedRandom();
      const div = document.createElement('div');
      div.className = 'roll-item';
      if(emoji === '7') div.innerHTML = '<span class="seven-casino">7</span>';
      else div.textContent = emoji;
      if(i === 25) div.id = 'winner-roll'; 
      track.appendChild(div);
    }
  }

  function generarRollVertical(ganadores) {
    for(let r = 0; r < 3; r++) {
      const track = document.getElementById(`track-${r}`);
      if(!track) continue;
      track.style.transition = 'none';
      track.style.transform = 'translateY(0)';
      track.innerHTML = '';
      for(let i = 0; i < 30; i++) {
        let emoji = (i === 25) ? ganadores[r] : getWeightedRandom();
        const div = document.createElement('div');
        div.className = 'reel-item';
        if(emoji === '7') div.innerHTML = '<span class="seven-casino">7</span>';
        else div.textContent = emoji;
        if(i === 25) div.classList.add('winner-target');
        track.appendChild(div);
      }
    }
  }

  function lanzar() {
    if(animando) return;
    animando = true;
    btnLanzar.disabled = true;
    btnLanzar.textContent = 'Lanzando...';

    if(modoActual === 'coin') {
      display.innerHTML = '<div class="sticker-coin"></div>';
      playSound('tick');
      timeoutId = setTimeout(() => {
        const res = Math.random() < 0.5 ? '👑' : '🦅';
        display.innerHTML = `<div class="coin pop">${res}</div>`;
        playSound('win'); lanzarConfeti();
        finalizarAnimacion();
      }, 500);
    } 
    else if(modoActual === 'dice') {
      display.innerHTML = '<div class="sticker-dice"></div>';
      playSound('tick');
      timeoutId = setTimeout(() => {
        const dados = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
        const res = dados[Math.floor(Math.random() * 6)];
        display.innerHTML = `<div class="dice pop">${res}</div>`;
        playSound('win'); lanzarConfeti();
        finalizarAnimacion();
      }, 500);
    }
    else if(modoActual === 'roll') {
      const ganador = getWeightedRandom();
      generarRollHorizontal(ganador);
      const track = document.getElementById('roll-track');
      const container = document.getElementById('roll-container');
      const winnerItem = document.getElementById('winner-roll');
      void track.offsetWidth; 
      const offset = (25 * 122) - (container.offsetWidth / 2) + (110 / 2) + 12; 
      track.style.transition = 'transform 4s cubic-bezier(0.1, 0.8, 0.2, 1)';
      track.style.transform = `translateY(-50%) translateX(-${offset}px)`;
      
      let lastIndex = -1;
      let isSpinning = true;
      function trackRollSound() {
        if (!isSpinning) return;
        const tr = window.getComputedStyle(track).transform;
        let tx = 0;
        if (tr && tr !== 'none') { const m = tr.match(/matrix.*\((.+)\)/); if (m) tx = Math.abs(parseFloat(m[1].split(', ')[4])); }
        const currentIndex = Math.floor(tx / 122); 
        if (currentIndex !== lastIndex) { playSound('tick'); lastIndex = currentIndex; }
        requestAnimationFrame(trackRollSound);
      }
      requestAnimationFrame(trackRollSound);
      setTimeout(() => { isSpinning = false; }, 4000);

      timeoutId = setTimeout(() => {
        if(winnerItem) winnerItem.classList.add('winner');
        playSound('win'); lanzarConfeti();
        finalizarAnimacion();
      }, 4100); 
    }
    else if(modoActual === 'triple') {
      let g0, g1, g2;
      // 10% de probabilidad de sacar un triple
      if (Math.random() < 0.1) {
        g0 = getWeightedRandom();
        g1 = g0;
        g2 = g0;
      } else {
        g0 = getWeightedRandom();
        g1 = getWeightedRandom();
        g2 = getWeightedRandom();
      }
      generarRollVertical([g0, g1, g2]);
      for(let r=0; r<3; r++) {
        const track = document.getElementById(`track-${r}`);
        void track.offsetWidth; 
        track.style.transition = 'transform 4s cubic-bezier(0.1, 0.8, 0.2, 1)';
        track.style.transform = `translateY(-${(25 * 102) + 45 - 147}px)`;
      }
      
      let lastIndices = [-1, -1, -1];
      let isSpinning = true;
      function trackTripleSound() {
        if (!isSpinning) return;
        for (let r = 0; r < 3; r++) {
          const trackEl = document.getElementById(`track-${r}`);
          if (!trackEl) continue;
          const tr = window.getComputedStyle(trackEl).transform;
          let ty = 0;
          if (tr && tr !== 'none') { const m = tr.match(/matrix.*\((.+)\)/); if (m) ty = Math.abs(parseFloat(m[1].split(', ')[5])); }
          const currentIndex = Math.floor(ty / 102);
          if (currentIndex !== lastIndices[r]) { playSound('tick'); lastIndices[r] = currentIndex; }
        }
        requestAnimationFrame(trackTripleSound);
      }
      requestAnimationFrame(trackTripleSound);
      setTimeout(() => { isSpinning = false; }, 4000);

      timeoutId = setTimeout(() => {
        if (g0 === g1 && g1 === g2) {
          document.querySelectorAll('.winner-target').forEach(el => el.classList.add('winner'));
          playSound('win'); lanzarConfeti();
          
          // Letrero visual de ¡TRIPLE!
          const overlayMsg = document.createElement('div');
          overlayMsg.textContent = '¡TRIPLE!';
          overlayMsg.style.cssText = 'position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) scale(0); font-size:70px; font-weight:900; color:#f59e0b; text-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index:100; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);';
          document.querySelector('.display-area').appendChild(overlayMsg);
          
          setTimeout(() => overlayMsg.style.transform = 'translate(-50%,-50%) scale(1)', 10);
          setTimeout(() => overlayMsg.style.transform = 'translate(-50%,-50%) scale(0)', 2500);
          setTimeout(() => overlayMsg.remove(), 2900);
          
        } else {
          playSound('lose');
        }
        finalizarAnimacion();
      }, 4100); 
    }
  }

  function jugarRPS(userChoice) {
    if (animando) return;
    animando = true;

    const machineBox = document.getElementById('rps-machine');
    const resultText = document.getElementById('rps-result');
    const btns = document.querySelectorAll('.rps-btn');

    btns.forEach(b => b.disabled = true);
    resultText.textContent = '...';
    resultText.style.color = 'var(--text-muted)';

    let counter = 0;
    intervalId = setInterval(() => {
      const rand = rpsOptions[Math.floor(Math.random() * 3)];
      machineBox.innerHTML = RPS_EMOJI[rand];
      machineBox.classList.add('pop');
      setTimeout(() => machineBox.classList.remove('pop'), 100);
      counter++;
      if (counter > 10) {
        clearInterval(intervalId);
        const machineChoice = rpsOptions[Math.floor(Math.random() * 3)];
        machineBox.innerHTML = RPS_EMOJI[machineChoice];
        const gana = { piedra: 'tijera', papel: 'piedra', tijera: 'papel' };
        if (userChoice === machineChoice) {
          resultText.textContent = "¡Empate! 🤝"; resultText.style.color = "#f59e0b";
          playSound('tick');
        } else if (gana[userChoice] === machineChoice) {
          resultText.textContent = "¡Ganaste! 🎉"; resultText.style.color = "#10b981";
          playSound('win'); lanzarConfeti();
        } else {
          resultText.textContent = "Perdiste 😢"; resultText.style.color = "#ef4444";
          playSound('lose');
        }
        btns.forEach(b => b.disabled = false);
        animando = false;
      }
    }, 100);
  }

  let currentRotation = 0;
  const colors = ['#ef4444', '#f59e0b', '#10b981', '#3b82f6', '#8b5cf6', '#ec4899', '#06b6d4', '#84cc16'];

  function dibujarRuleta() {
    const canvas = document.getElementById('wheel-canvas');
    if(!canvas) return;
    const ctx = canvas.getContext('2d');
    const input = document.getElementById('roulette-options').value;
    let options = input.split(/[\n,]+/).map(s => s.trim()).filter(s => s.length > 0);
    if(options.length < 2) options = ['Añade', 'Opciones'];

    const num = options.length;
    const anglePerSlice = (Math.PI * 2) / num;
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const radius = Math.min(centerX, centerY) - 10;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let i = 0; i < num; i++) {
      const startAngle = i * anglePerSlice;
      const endAngle = startAngle + anglePerSlice;

      ctx.beginPath();
      ctx.moveTo(centerX, centerY);
      ctx.arc(centerX, centerY, radius, startAngle, endAngle);
      ctx.fillStyle = colors[i % colors.length];
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.save();
      ctx.translate(centerX, centerY);
      ctx.rotate(startAngle + anglePerSlice / 2);
      ctx.textAlign = 'right';
      ctx.fillStyle = '#fff';
      
      let fontSize = num > 6 ? 12 : 15;
      ctx.font = `bold ${fontSize}px Inter, sans-serif`;
      ctx.shadowColor = 'rgba(0,0,0,0.5)';
      ctx.shadowBlur = 3;
      
      let text = options[i];
      if(text.length > 12) text = text.substring(0, 10) + '...';
      
      ctx.fillText(text, radius - 15, 5);
      ctx.restore();
    }
  }

  function girarRuleta() {
    if(animando) return;
    animando = true;

    const canvas = document.getElementById('wheel-canvas');
    const input = document.getElementById('roulette-options').value;
    let options = input.split(/[\n,]+/).map(s => s.trim()).filter(s => s.length > 0);
    if(options.length < 2) { alert("Escribe al menos 2 opciones."); animando = false; return; }

    dibujarRuleta();

    const spins = 5 + Math.random() * 5;
    const randomDeg = Math.random() * 360;
    const totalRotation = (spins * 360) + randomDeg;
    
    currentRotation += totalRotation;
    canvas.style.transform = `rotate(${currentRotation}deg)`;

    let lastSliceIndex = -1;
    let isSpinning = true;
    
    function trackWheelSound() {
      if (!isSpinning) return;
      const st = window.getComputedStyle(canvas);
      const tr = st.getPropertyValue("transform");
      let currentDeg = 0;
      if (tr && tr !== 'none') {
        const values = tr.split('(')[1].split(')')[0].split(',');
        const a = values[0];
        const b = values[1];
        currentDeg = Math.atan2(b, a) * (180 / Math.PI);
        if (currentDeg < 0) currentDeg += 360;
      }
      const sliceAngle = 360 / options.length;
      const pointerAngle = (270 - currentDeg + 360) % 360;
      const currentSlice = Math.floor(pointerAngle / sliceAngle);

      if (currentSlice !== lastSliceIndex) {
        if (lastSliceIndex !== -1) playSound('tick');
        lastSliceIndex = currentSlice;
      }
      requestAnimationFrame(trackWheelSound);
    }
    
    requestAnimationFrame(trackWheelSound);
    setTimeout(() => { isSpinning = false; }, 4000);

    timeoutId = setTimeout(() => {
      const normalizedRotation = currentRotation % 360;
      const sliceAngle = 360 / options.length;
      const adjustedRotation = (270 - normalizedRotation + 360) % 360;
      const winningIndex = Math.floor(adjustedRotation / sliceAngle);
      const ganador = options[winningIndex];

      playSound('win'); 
      lanzarConfeti();
      
      const resultDiv = document.getElementById('roulette-result');
      if (resultDiv) {
        resultDiv.textContent = `🎉 ¡${ganador}! 🎉`;
        resultDiv.classList.add('pop');
      }
      
      animando = false;
    }, 4000);
  }

  function ejecutarEscritor() {
    if(animando) return;
    animando = true;
    const input = document.getElementById('writer-options').value;
    const displayEl = document.getElementById('writer-display');
    let opciones = input.split(/[\n,]+/).map(s => s.trim()).filter(s => s.length > 0);

    if(opciones.length < 2) { alert("Escribe al menos 2 opciones."); animando = false; return; }

    displayEl.classList.remove('active');
    displayEl.classList.add('pop');
    setTimeout(() => displayEl.classList.remove('pop'), 300);

    let counter = 0;
    const maxIterations = 25 + Math.floor(Math.random() * 15);
    
    intervalId = setInterval(() => {
      const temp = opciones[Math.floor(Math.random() * opciones.length)];
      displayEl.textContent = temp;
      playSound('tick');
      counter++;

      if (counter >= maxIterations) {
        clearInterval(intervalId);
        const ganador = opciones[Math.floor(Math.random() * opciones.length)];
        displayEl.textContent = ganador;
        displayEl.classList.add('active', 'pop');
        playSound('win');
        lanzarConfeti();
        animando = false;
      }
    }, 60);
  }

  function ejecutarEscritorNota() {
    if(animando) return;
    animando = true;

    const input = document.getElementById('note-options').value;
    const noteEl = document.getElementById('note-display');
    let opciones = input.split(/[\n,]+/).map(s => s.trim()).filter(s => s.length > 0);

    if(opciones.length < 2) { alert("Escribe al menos 2 opciones."); animando = false; return; }

    const ganador = opciones[Math.floor(Math.random() * opciones.length)];
    noteEl.innerHTML = '';
    noteEl.style.color = '#1f2937';
    noteEl.style.transform = 'rotate(-1deg) scale(1)';
    
    // Ajuste dinámico para que el texto siempre quepa en la nota
    let fontSize = 72;
    if (ganador.length > 50) fontSize = 14;
    else if (ganador.length > 40) fontSize = 18;
    else if (ganador.length > 30) fontSize = 22;
    else if (ganador.length > 25) fontSize = 26;
    else if (ganador.length > 18) fontSize = 32;
    else if (ganador.length > 12) fontSize = 44;
    else if (ganador.length > 8) fontSize = 56;
    noteEl.style.fontSize = fontSize + 'px';

    let i = 0;
    intervalId = setInterval(() => {
      noteEl.textContent += ganador.charAt(i);
      playSound('type');
      i++;
      if(i >= ganador.length) {
        clearInterval(intervalId);
        setTimeout(() => {
          playSound('win');
          lanzarConfeti();
          noteEl.style.color = '#ef4444'; 
          noteEl.style.transform = 'rotate(1deg) scale(1.05)';
          animando = false;
        }, 600);
      }
    }, 120);
  }

  function finalizarAnimacion() {
    btnLanzar.disabled = false;
    btnLanzar.textContent = '¡Lanzar de nuevo!';
    animando = false;
  }
</script>
